<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#48101d">
  <title>Detalle privado ♥</title>
  <style>
    *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#8e2942,#48101d 58%,#240811);color:#fff9f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}.card{width:min(440px,100%);padding:42px 28px;border:1px solid rgba(255,255,255,.22);border-radius:28px;background:rgba(255,255,255,.09);box-shadow:0 24px 80px rgba(20,0,6,.35);backdrop-filter:blur(12px)}.heart{font-size:42px;color:#f2b8c1;animation:pulse 1.8s ease-in-out infinite}h1{margin:14px 0 10px;font-family:Georgia,serif;font-size:clamp(2rem,8vw,3rem);font-weight:500}p{margin:0;line-height:1.6;color:#f4dfe2}@keyframes pulse{50%{transform:scale(1.12)}} 
  </style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">♥</div>
    <h1>Este detalle es privado</h1>
    <p id="status">Abriendo tu sorpresa…</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const fragment = location.hash.slice(1);
      if (!fragment) {
        status.textContent = "Usa el enlace completo incluido en el código QR.";
        return;
      }
      try {
        const normalized = fragment.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
        const keyBytes = Uint8Array.from(atob(padded), c => c.charCodeAt(0));
        if (keyBytes.length !== 32) throw new Error("Clave inválida");
        const response = await fetch("content.enc", {cache: "no-store"});
        if (!response.ok) throw new Error("Contenido no disponible");
        const encoded = (await response.text()).trim();
        const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
        const iv = bytes.slice(0, 12);
        const cipherText = bytes.slice(12);
        const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
        const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, cipherText);
        const page = new TextDecoder().decode(plain);
        document.open();
        document.write(page);
        document.close();
      } catch {
        status.textContent = "Este enlace no es válido o está incompleto.";
      }
    })();
  </script>
</body>
</html>
